<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
}

/* ================= CATALOGO TV SAFE ================= */
#catalog {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 60px;
}

.section {
  margin-bottom: 32px;
}

.section-title {
  color: #fff;
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 10px 40px;
}

.row {
  display: flex;
  gap: 16px;
  padding-left: 40px;
  overflow-x: auto;
}

.row::-webkit-scrollbar {
  display: none;
}

/* ================= CARD ================= */
.card {
  min-width: 260px;
  height: 145px;
  background-size: cover;
  background-position: center;
  border-radius: 8px;
  cursor: pointer;
}

.card:focus {
  outline: 3px solid #fff;
}

/* ================= ADS ================= */
.ads-card {
  min-width: 320px;
  height: 180px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
}
  
/* ===== SESSÃO DE ANÚNCIOS (TV SAFE) ===== */
.ads-card {
  min-width: 320px;
  height: 180px;
  background: #111;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ads-card:focus {
  outline: 3px solid #fff;
}

.ads-container {
  width: 100%;
  height: 100%;
}
/* ================= HERO ================= */
#hero{
  height:65vh;
  background-size:contain;
  background-position:center top;
  background-repeat:no-repeat;
  position:relative;
}

#hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.2) 50%,transparent);
}

#heroContent{
  position:absolute;
  bottom:40px;
  left:40px;
  z-index:2;
  max-width:60%;
}

#title{font-size:36px;font-weight:bold}
#meta{opacity:.8;margin:8px 0}
#desc{max-width:600px;opacity:.9}

#playBtn{
  margin-top:15px;
  padding:14px 26px;
  font-size:18px;
  background:#fff;
  color:#000;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* ================= SCROLL AREA ================= */
#catalog{
  position:absolute;
  bottom:0;
  width:100%;
  height:45vh;
  overflow-y:auto;
  padding:20px 0 40px;
  background:linear-gradient(to top,#000 80%,transparent);
  overscroll-behavior: contain;
  touch-action: pan-x;

}
  
/* ================= ROW ================= */
.section{
  margin-bottom:30px;
}

.section-title{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  height:auto !important;
  color:#fff;
  font-size:20px;
  font-weight:600;
  margin:20px 0 10px 40px;
}

.row{
  display:flex;
  gap:14px;
  padding-left:40px;
  overflow-x:auto;
}

.row::-webkit-scrollbar{display:none}

/* ================= CARD ================= */
.card{
  min-width:260px;
  height:145px;
  background-size:cover;
  background-position:center;
  border-radius:8px;
  cursor:pointer;
  transition:outline .2s, box-shadow .2s;
}

.card:hover,
.card:focus,
.card:active{
  outline:3px solid #fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.6);
}

/* ================= PLAYER ================= */
#playerOverlay{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
}

#playerFrame{
  width:100%;
  height:100%;
  border:none;
}

/* ================= PLAYER CONTROLS ================= */
#backBtn{
  position:absolute;
  top:20px;
  left:20px;
  z-index:10000;
  padding:10px 16px;
  background:rgba(0,0,0,.7);
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.plus-block-newtab-btn{
  position:absolute;
  top:9px;
  right:12px;
  width:50px;
  height:55px;
  border-radius:70%;
  background:rgba(0,0,0,.7);
  color:#fff;
  border:none;
  cursor:pointer;
  z-index:10000;
}
  
</style>
</head>
<body>

<!-- HERO -->
<div id="hero">

/* ================= LÓGICA DE EXECUÇÃO E SUPORTE TV ================= */
let currentIndex = 0;
const hero = document.getElementById("hero");
const titleEl = document.getElementById("title");
const metaEl  = document.getElementById("meta");
const descEl  = document.getElementById("desc");
const playBtn = document.getElementById("playBtn");
const catalog = document.getElementById("catalog");
const playerOverlay = document.getElementById("playerOverlay");
const playerFrame = document.getElementById("playerFrame");

function setHero(i){
  const m = movieData[i];
  if(!m) return;
  hero.style.backgroundImage = `url(${m.poster})`;
  titleEl.textContent = m.title;
  metaEl.textContent = `${m.year} • ${m.genres.join(" / ")}`;
  descEl.textContent = m.description;
  playBtn.onclick = ()=>openPlayer(m.videoUrl);
}

function toDrivePreview(url){
  if(url && url.includes("drive.google.com") && !url.includes("/preview")){
    const id = url.match(/\/d\/(.*?)\//);
    if(id) return `https://drive.google.com/file/d/${id[1]}/preview?rm=minimal&autoplay=1`;
  }
  if(url && url.includes("drive.google.com") && url.includes("/preview") && !url.includes("autoplay=1")){
    return url + (url.includes("?") ? "&" : "?") + "rm=minimal&autoplay=1";
  }
  return url;
}

function openPlayer(url){
  playerFrame.src = toDrivePreview(url);
  playerOverlay.style.display="block";
}

function closePlayer(){
  playerFrame.src="";
  playerOverlay.style.display="none";
}

document.getElementById("backBtn").onclick = closePlayer;
playerOverlay.onclick = closePlayer;
playerFrame.onclick = e=>e.stopPropagation();

/* ================= MONTAGEM DO CATÁLOGO POR SESSÕES ================= */
const sessionNames = [
  "Destaques",
  "Clássicos",
  "Cinema Mundial",
  "Drama",
  "Suspense",
  "Cult",
  "Históricos",
  "Independentes",
  "Seleção Especial"
];

function buildCatalog(){
  catalog.innerHTML = "";

  for(let i = 0; i < movieData.length; i += 30){
    const sectionIndex = Math.floor(i / 30);
    const section = document.createElement("div");
    section.className = "section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = sessionNames[sectionIndex] || "Catálogo";

    const row = document.createElement("div");
    row.className = "row";

    movieData.slice(i, i + 30).forEach((movie, idx)=>{
      const realIndex = i + idx;
      const card = document.createElement("div");
      card.className = "card";
      card.style.backgroundImage = `url(${movie.poster})`;
      card.tabIndex = 0; // Garante foco por D-pad na TV

      card.addEventListener("click", ()=>{
        currentIndex = realIndex;
        setHero(realIndex);
      });

      // Duplo clique / clique duplo rápido para abrir na TV
      let lastTap = 0;
      card.addEventListener("click", ()=>{
        const now = Date.now();
        if(now - lastTap < 350){
          openPlayer(movie.videoUrl);
        }
        lastTap = now;
      });

      row.appendChild(card);
    });

    section.appendChild(title);
    section.appendChild(row);
    catalog.appendChild(section);
  }
}

window.addEventListener("load", ()=>{
  buildCatalog();
  if(movieData.length > 0){
    setHero(0);
  }
});
</script>

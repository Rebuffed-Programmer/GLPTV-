
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plus+ TV</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://i.postimg.cc/d3cRw6yH/favicon-32x32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root {
  --bg-primary: #000000;
  --bg-secondary: #121517;
  --bg-elevated: #1c2124;
  --accent-green: #48c948;
  --accent-green-hover: #3b9f3b;
  --text-main: #ffffff;
  --text-muted: #9aa0a6;
  --border-subtle: rgba(255, 255, 255, 0.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  outline: none;
}

body {
  background: var(--bg-primary);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

/* FOCO TV (D-PAD / CONTROLE REMOTO) */
.tv-focusable:focus,
button:focus,
input:focus,
a:focus {
  outline: 4px solid var(--accent-green) !important;
  outline-offset: 2px;
  box-shadow: 0 0 24px rgba(72, 201, 72, 0.55) !important;
  transform: scale(1.03);
  z-index: 20;
}

/* ================= BARRA LATERAL TV (SIDE RAIL) ================= */
#tvSidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 84px;
  height: 100vh;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.85) 100%);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 22px 0;
  z-index: 1500;
  transition: width 0.25s ease;
}

#tvSidebar:hover,
#tvSidebar:focus-within {
  width: 230px;
  align-items: flex-start;
  padding-left: 18px;
  background: rgba(10, 12, 14, 0.98);
}

.tv-logo {
  height: 36px;
  margin-bottom: 24px;
  object-fit: contain;
}

.tv-nav-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  padding-right: 14px;
}

.tv-nav-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 13px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 12px;
  color: var(--text-muted);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  transition: all 0.2s ease;
}

.tv-nav-btn i {
  font-size: 20px;
  min-width: 24px;
  text-align: center;
}

.tv-nav-btn span {
  opacity: 0;
  transition: opacity 0.2s ease;
}

#tvSidebar:hover .tv-nav-btn span,
#tvSidebar:focus-within .tv-nav-btn span {
  opacity: 1;
}

.tv-nav-btn.active,
.tv-nav-btn:hover,
.tv-nav-btn:focus {
  background: rgba(72, 201, 72, 0.16);
  color: var(--accent-green);
  border-color: rgba(72, 201, 72, 0.4);
}

.tv-sidebar-footer {
  margin-top: auto;
  width: 100%;
  padding-right: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tv-avatar-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.tv-avatar-wrap img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--accent-green);
  object-fit: cover;
}

#hiddenGoogleBtn {
  position: absolute;
  inset: 0;
  opacity: 0;
  z-index: 5;
}

.kids-pill-tv {
  display: none;
  background: var(--accent-green);
  color: #000;
  font-size: 11px;
  font-weight: 900;
  padding: 3px 8px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.kids-pill-tv.active { display: inline-block; }

/* ================= ÁREA PRINCIPAL TV ================= */
#tvMain {
  margin-left: 84px;
  width: calc(100vw - 84px);
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ================= HERO SHOWCASE + ROLETA 4 SLOTS ================= */
#hero {
  height: 54vh;
  width: 100%;
  background-size: cover;
  background-position: center 20%;
  background-repeat: no-repeat;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 0 48px 34px 48px;
  transition: background-image 0.5s ease;
}

#hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.65) 48%, rgba(0, 0, 0, 0.15) 100%),
    linear-gradient(to top, #000000 4%, rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0.5) 100%);
  pointer-events: none;
}

#heroContent {
  position: relative;
  z-index: 5;
  max-width: 680px;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(72, 201, 72, 0.18);
  color: var(--accent-green);
  border: 1px solid rgba(72, 201, 72, 0.45);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

#title {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.12;
  margin-bottom: 8px;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
}

#meta {
  font-size: 15px;
  color: var(--accent-green);
  font-weight: 700;
  margin-bottom: 10px;
}

#desc {
  font-size: 16px;
  color: #d0d5da;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 18px;
}

.hero-actions {
  display: flex;
  gap: 14px;
  align-items: center;
}

.btn-tv-primary {
  padding: 13px 28px;
  font-size: 17px;
  font-weight: 800;
  background: var(--accent-green);
  color: #000;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.btn-tv-secondary {
  padding: 13px 22px;
  font-size: 16px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

/* Controles da Roleta no Hero */
.roleta-controls {
  position: absolute;
  bottom: 34px;
  right: 48px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
}

.roleta-arrow {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(18, 21, 23, 0.85);
  border: 1px solid var(--border-subtle);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.roleta-dots {
  display: flex;
  gap: 8px;
}

.roleta-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
  border: none;
  cursor: pointer;
  transition: all 0.25s ease;
}

/* ================= CATALOGO TV SAFE (SCROLL VERTICAL DE FILEIRAS) ================= */
#catalog {
  position: relative;
  width: 100%;
  height: 46vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 0 80px 0;
  background: linear-gradient(to top, #000 88%, transparent);
  scroll-behavior: smooth;
}

#catalog.full-height {
  height: 100vh;
  padding-top: 32px;
}

#catalog::-webkit-scrollbar {
  width: 6px;
}
#catalog::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
}

/* Barra rápida de gêneros */
.tv-genre-bar {
  display: flex;
  gap: 12px;
  padding: 4px 48px 18px 48px;
  overflow-x: auto;
}
.tv-genre-bar::-webkit-scrollbar { display: none; }

.genre-pill {
  background: var(--bg-secondary);
  color: #fff;
  border: 1px solid var(--border-subtle);
  padding: 9px 18px;
  border-radius: 22px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.genre-pill.active {
  background: var(--accent-green);
  color: #000;
  border-color: var(--accent-green);
}

.section {
  margin-bottom: 28px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px 12px 48px;
}

.section-title {
  color: #fff;
  font-size: 21px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: "";
  width: 4px;
  height: 20px;
  background: var(--accent-green);
  border-radius: 4px;
}

.row {
  display: flex;
  gap: 18px;
  padding: 8px 48px 14px 48px;
  overflow-x: auto;
  scroll-behavior: smooth;
}

.row::-webkit-scrollbar {
  display: none;
}

.row.grid-mode {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  overflow-x: visible;
}

/* ================= CARDS 16:9 TV ================= */
.card {
  position: relative;
  min-width: 265px;
  width: 265px;
  height: 150px;
  background-color: var(--bg-secondary);
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  cursor: pointer;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.row.grid-mode .card {
  width: 100%;
  min-width: unset;
}

.card-overlay {
  position: absolute;
  inset: auto 0 0 0;
  padding: 26px 12px 10px 12px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 25%, transparent 100%);
  pointer-events: none;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.badge-live {
  position: absolute;
  top: 10px;
  left: 10px;
  background: var(--accent-green);
  color: #000;
  font-size: 11px;
  font-weight: 900;
  padding: 3px 9px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.badge-price {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.88);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  font-size: 12px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
}

.badge-list {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.78);
  color: #fff;
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.badge-list.active {
  background: var(--accent-green);
  color: #000;
}

/* ================= MODAIS TV ================= */
.tv-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(12px);
  z-index: 25000;
  justify-content: center;
  align-items: center;
  padding: 32px;
}

.tv-modal-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  width: 100%;
  max-width: 820px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  position: relative;
}

.modal-flex {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.modal-poster-tv {
  width: 320px;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.rec-grid-tv {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 12px;
}

.rec-card-tv {
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid var(--border-subtle);
  cursor: pointer;
}
.rec-card-tv img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ================= PLAYER FULLSCREEN UNIFICADO ================= */
#playerOverlay {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  z-index: 99999;
}

#playerFrame {
  width: 100%;
  height: 100%;
  border: none;
}

#backBtn {
  position: absolute;
  top: 22px;
  left: 24px;
  z-index: 100000;
  padding: 12px 22px;
  background: rgba(18, 21, 23, 0.88);
  color: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.plus-block-newtab-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(18, 21, 23, 0.55);
  color: #fff;
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  z-index: 100000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================= PESQUISA TV ================= */
#searchOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.96);
  z-index: 30000;
  flex-direction: column;
  padding: 36px 56px;
}

.search-top-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
}

.search-input-tv {
  flex: 1;
  padding: 16px 22px;
  border-radius: 12px;
  border: 2px solid var(--accent-green);
  background: var(--bg-secondary);
  color: #fff;
  font-size: 20px;
}

.search-grid-tv {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 18px;
  overflow-y: auto;
  padding: 8px 4px 40px 4px;
}
</style>
</head>
<body>

<!-- BARRA LATERAL TV -->
<aside id="tvSidebar" aria-label="Menu Principal TV">
  <img src="https://i.postimg.cc/fbm60y7Q/logo.png" alt="Plus+" class="tv-logo">
  <span id="kidsBadgeTv" class="kids-pill-tv">KIDS</span>

  <nav class="tv-nav-list">
    <button class="tv-nav-btn tv-focusable active" data-nav="home"><i class="fas fa-home"></i><span>Início</span></button>
    <button class="tv-nav-btn tv-focusable" data-nav="search"><i class="fas fa-search"></i><span>Pesquisar</span></button>
    <button class="tv-nav-btn tv-focusable" data-nav="live"><i class="fas fa-broadcast-tower"></i><span>Ao Vivo</span></button>
    <button class="tv-nav-btn tv-focusable" data-nav="list"><i class="fas fa-bookmark"></i><span>Minha Lista</span></button>
    <button class="tv-nav-btn tv-focusable" data-nav="classix"><i class="fas fa-film"></i><span>Clássicos YT</span></button>
    <button class="tv-nav-btn tv-focusable" data-nav="plus"><i class="fas fa-gem"></i><span>Plus+ VIP</span></button>
    <button class="tv-nav-btn tv-focusable" data-nav="kids"><i class="fas fa-child"></i><span id="kidsNavLabel">Modo Kids</span></button>
  </nav>

  <div class="tv-sidebar-footer">
    <div class="tv-avatar-wrap tv-focusable" tabindex="0" id="tvProfileTrigger">
      <img id="tvAvatarImg" src="https://i.postimg.cc/mrQ0R1LV/Plus-Avatar-icon.jpg" alt="Perfil">
      <div style="overflow:hidden;">
        <div id="tvUserName" style="font-size:13px; font-weight:700; white-space:nowrap;">Visitante GL+</div>
        <div id="tvUserStatus" style="font-size:11px; color:var(--accent-green);">Conta Gratuita</div>
      </div>
      <div id="hiddenGoogleBtn"></div>
    </div>
  </div>
</aside>

<!-- CONTEÚDO PRINCIPAL -->
<main id="tvMain">
  <!-- HERO SHOWCASE (ROLETA 4 SLOTS) -->
  <section id="hero">
    <div id="heroContent">
      <div class="hero-tag" id="heroTag"><i class="fas fa-bolt"></i> DESTAQUE PLUS+</div>
      <div id="title">Carregando...</div>
      <div id="meta"></div>
      <div id="desc"></div>
      <div class="hero-actions">
        <button id="playBtn" class="btn-tv-primary tv-focusable"><i class="fas fa-play"></i> Assistir Agora</button>
        <button id="heroListBtn" class="btn-tv-secondary tv-focusable"><i class="fas fa-plus"></i> Minha Lista</button>
      </div>
    </div>

    <div class="roleta-controls">
      <button class="roleta-arrow tv-focusable" id="roletaPrev" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>
      <div class="roleta-dots" id="roletaDots"></div>
      <button class="roleta-arrow tv-focusable" id="roletaNext" aria-label="Próximo"><i class="fas fa-chevron-right"></i></button>
    </div>
  </section>

  <!-- FILEIRAS DO CATÁLOGO -->
  <div id="catalog"></div>
</main>

<!-- MODAL DE DETALHES -->
<div id="detailModal" class="tv-modal">
  <div class="tv-modal-box">
    <div class="modal-flex">
      <img id="modalPoster" class="modal-poster-tv" src="" alt="Poster">
      <div style="flex:1;">
        <h2 id="modalTitle" style="font-size:28px; margin-bottom:8px;"></h2>
        <div id="modalMeta" style="color:var(--accent-green); font-weight:700; margin-bottom:12px;"></div>
        <p id="modalDesc" style="color:#ccc; font-size:15px; line-height:1.5; margin-bottom:20px;"></p>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <button id="modalWatchBtn" class="btn-tv-primary tv-focusable"><i class="fas fa-play"></i> Assistir Agora</button>
          <button id="modalListBtn" class="btn-tv-secondary tv-focusable"><i class="fas fa-plus"></i> Minha Lista</button>
          <button id="modalCloseBtn" class="btn-tv-secondary tv-focusable"><i class="fas fa-times"></i> Fechar</button>
        </div>
      </div>
    </div>
    <div style="margin-top:24px; border-top:1px solid var(--border-subtle); padding-top:18px;">
      <h3 style="font-size:16px; color:#fff;">Títulos Relacionados</h3>
      <div class="rec-grid-tv" id="modalRecGrid"></div>
    </div>
  </div>
</div>

<!-- MODAL DE COMPRA -->
<div id="buyModal" class="tv-modal">
  <div class="tv-modal-box" style="max-width:520px; text-align:center;">
    <img id="buyPoster" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px; margin-bottom:16px;" src="" alt="">
    <h2 id="buyTitle" style="margin-bottom:8px;"></h2>
    <p id="buyMeta" style="color:var(--text-muted); margin-bottom:14px;"></p>
    <p id="buyQuestion" style="color:#ddd; margin-bottom:20px;"></p>
    <div style="display:flex; gap:12px; justify-content:center;">
      <a id="buyLinkBtn" href="#" target="_blank" class="btn-tv-primary tv-focusable" style="text-decoration:none;"><i class="fas fa-shopping-bag"></i> Comprar Agora</a>
      <button id="buyCloseBtn" class="btn-tv-secondary tv-focusable">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL ASSINATURA PLUS+ & TOKEN -->
<div id="plusModal" class="tv-modal">
  <div class="tv-modal-box" style="max-width:680px; text-align:center;">
    <img src="https://i.postimg.cc/yN37MSRy/P-ster-das-assinaturas-Plus.jpg" alt="Plus+" style="width:100%; max-height:200px; object-fit:cover; border-radius:12px; margin-bottom:16px;">
    <h2 style="margin-bottom:8px;">Assinatura Plus+ VIP</h2>
    <p style="color:#ccc; margin-bottom:18px;">Ative com sua Conta Google, insira seu Token Familiar ou assine um plano.</p>
    <div style="display:flex; gap:12px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;">
      <button id="plusTabLogin" class="btn-tv-primary tv-focusable"><i class="fas fa-key"></i> Ativar Token / Google</button>
      <button id="plusTabPlans" class="btn-tv-secondary tv-focusable"><i class="fas fa-crown"></i> Ver Planos</button>
      <button id="plusCloseBtn" class="btn-tv-secondary tv-focusable">Fechar</button>
    </div>
    <div id="plusDynamicArea" style="text-align:left;"></div>
  </div>
</div>

<!-- PESQUISA FULLSCREEN TV -->
<div id="searchOverlay">
  <div class="search-top-bar">
    <input type="text" id="searchInput" class="search-input-tv tv-focusable" placeholder="Buscar filme, gênero, ano ou ID...">
    <button id="closeSearchBtn" class="btn-tv-secondary tv-focusable"><i class="fas fa-times"></i> Fechar</button>
  </div>
  <div id="searchCount" style="color:var(--text-muted); margin-bottom:16px;">Digite para buscar em todo o catálogo</div>
  <div id="searchGrid" class="search-grid-tv"></div>
</div>

<!-- PLAYER FULLSCREEN -->

function limparStringTitulo(texto) {
  if (!texto) return '';
  return texto
    .replace(/classix/gi, '')
    .replace(/full\s*movie/gi, '')
    .replace(/\bhd\b/gi, '')
    .replace(/\[\s*\]|\(\s*\)/g, '')
    .replace(/[\|\-\–\—]\s*$/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

/* ==========================================================================
   3. SISTEMA CONTINUAR ASSISTINDO (EXPIRA EM 3 DIAS)
   ========================================================================== */
const EXPIRACAO_MS = 3 * 24 * 60 * 60 * 1000;

function salvarNoContinuarAssistindo(movieId) {
  if (!movieId) return;
  const hist = JSON.parse(localStorage.getItem('plus_continuar') || '{}');
  hist[String(movieId)] = Date.now();
  localStorage.setItem('plus_continuar', JSON.stringify(hist));
}

function getContinuarAssistindo() {
  const hist = JSON.parse(localStorage.getItem('plus_continuar') || '{}');
  const agora = Date.now();
  const validos = [];
  Object.keys(hist).forEach(id => {
    if (agora - hist[id] > EXPIRACAO_MS) {
      delete hist[id];
    } else {
      const filme = movieData.find(m => String(m.id) === String(id));
      if (filme) validos.push({ filme, time: hist[id] });
    }
  });
  localStorage.setItem('plus_continuar', JSON.stringify(hist));
  validos.sort((a, b) => b.time - a.time);
  return validos.map(v => v.filme);
}

/* ==========================================================================
   4. PLAYER MULTIFONTE UNIFICADO (GOOGLE DRIVE + YOUTUBE VÍDEO/PLAYLIST)
   ========================================================================== */
function getYouTubeInfo(url) {
  if (!url) return null;
  try {
    const value = String(url).trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(value)) return { type: "video", id: value };
    const parsed = new URL(value);
    const host = parsed.hostname.replace(/^www\./, "");
    const path = parsed.pathname;
    if (host === "youtu.be" || host.endsWith("youtube.com") || host === "youtube-nocookie.com") {
      const playlist = parsed.searchParams.get("list");
      if (playlist && path.includes("playlist")) return { type: "playlist", id: playlist };
      const videoId =
        parsed.searchParams.get("v") ||
        path.match(/\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]{11})/)?.[1] ||
        (host === "youtu.be" ? path.slice(1).split("/")[0] : null);
      if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) return { type: "video", id: videoId };
      if (playlist) return { type: "playlist", id: playlist };
    }
  } catch (e) {}
  return null;
}

function launchPlayerTV(videoUrl, movieId = null) {
  const overlay = document.getElementById('playerOverlay');
  const frame = document.getElementById('playerFrame');
  if (!overlay || !frame || !videoUrl) return;

  if (movieId) {
    salvarNoContinuarAssistindo(movieId);
  }

  const yt = getYouTubeInfo(videoUrl);
  let finalUrl = videoUrl;

  if (yt) {
    if (yt.type === "playlist") {
      finalUrl = `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(yt.id)}&autoplay=1&rel=0&playsinline=1&loop=1`;
    } else {
      finalUrl = `https://www.youtube.com/embed/${encodeURIComponent(yt.id)}?autoplay=1&rel=0&playsinline=1`;
    }
  } else if (finalUrl.includes('drive.google.com')) {
    if (!finalUrl.includes('preview')) {
      finalUrl = finalUrl.replace(/\/view.*$/, '/preview').replace(/\/edit.*$/, '/preview');
    }
    if (!finalUrl.includes('autoplay=1')) {
      finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'autoplay=1&rm=minimal';
    }
  }

  frame.src = finalUrl;
  overlay.style.display = 'block';
  document.getElementById('backBtn').focus();
}

function closePlayerTV() {
  const overlay = document.getElementById('playerOverlay');
  const frame = document.getElementById('playerFrame');
  frame.src = '';
  overlay.style.display = 'none';
  buildCatalogTV();
}

  const isSingle = channel.playlistId.length < 24;
  const ytUrl = isSingle
    ? `https://www.youtube.com/embed/${channel.playlistId}?autoplay=1&modestbranding=1&rel=0&controls=0&loop=1&playlist=${channel.playlistId}`
    : `https://www.youtube.com/embed/videoseries?list=${channel.playlistId}&autoplay=1&modestbranding=1&rel=0&controls=0&loop=1`;
  launchPlayerTV(ytUrl, null);
}

    document.getElementById('heroTag').innerHTML = `<i class="fas fa-bolt"></i> ${s.tag}`;
    document.getElementById('title').textContent = s.titulo;
    document.getElementById('meta').textContent = s.meta;
    document.getElementById('desc').textContent = s.descricao;

    const playBtn = document.getElementById('playBtn');
    playBtn.innerHTML = `<i class="${s.icone}"></i> ${s.textoBotao}`;

    if (s.tipo === "filme") {
      currentHeroMovie = s.filme;
      playBtn.onclick = () => openDetailModal(s.filme);
    } else if (s.tipo === "compra") {
      currentHeroMovie = null;
      playBtn.onclick = () => openBuyModal(s.item, s.price);
    } else {
      currentHeroMovie = null;
      playBtn.onclick = () => window.open(s.url, '_blank');
    }
    updateHeroListButton();

    dotsContainer.querySelectorAll('.roleta-dot').forEach((dot, i) => {
      dot.style.background = i === roletaIndex ? '#48c948' : 'rgba(255,255,255,0.35)';
      dot.style.width = i === roletaIndex ? '26px' : '10px';
      dot.style.borderRadius = i === roletaIndex ? '6px' : '50%';
    });
  }

  document.getElementById('roletaPrev').onclick = () => {
    applySlot(roletaIndex - 1);
    resetRoletaTimer();
  };
  document.getElementById('roletaNext').onclick = () => {
    applySlot(roletaIndex + 1);
    resetRoletaTimer();
  };

  function resetRoletaTimer() {
    clearInterval(roletaTimer);
    roletaTimer = setInterval(() => applySlot(roletaIndex + 1), 7000);
  }

  applySlot(0);
  resetRoletaTimer();
}

let activeGenreFilter = 'Todos';

function buildCatalogTV(viewMode = 'home') {
  const catalogEl = document.getElementById('catalog');
  const heroEl = document.getElementById('hero');
  catalogEl.innerHTML = '';

  const catalog = getActiveCatalog();

  if (viewMode === 'list') {
    heroEl.style.display = 'none';
    catalogEl.classList.add('full-height');
    const listIds = getMyList();
    const myMovies = catalog.filter(m => listIds.includes(m.id));
    if (myMovies.length === 0) {
      catalogEl.innerHTML = `<div style="padding:48px; color:var(--text-muted); font-size:20px;">Sua lista está vazia. Selecione um filme e clique em "Minha Lista".</div>`;
    } else {
      appendRowSection(catalogEl, 'Minha Lista Salva', myMovies, createMovieCardTV, true);
    }
    return;
  }

  if (viewMode === 'plus') {
    if (!isSubscriptionActive()) {
      openPlusModal();
      return;
    }
    heroEl.style.display = 'none';
    catalogEl.classList.add('full-height');
    appendRowSection(catalogEl, 'Catálogo Plus+ VIP Exclusivo', catalog, createMovieCardTV, true);
    return;
  }

  if (viewMode === 'classix') {
    heroEl.style.display = 'none';
    catalogEl.classList.add('full-height');
    renderClassixYouTubeSection(catalogEl, true);
    return;
  }

  if (viewMode === 'live') {
    heroEl.style.display = 'none';
    catalogEl.classList.add('full-height');
    appendRowSection(catalogEl, 'Canais ao Vivo 24h', liveChannels, (ch) => {
      const card = document.createElement('div');
      card.className = 'card tv-focusable';
      card.tabIndex = 0;
      card.style.backgroundImage = `url('${ch.poster}')`;
      card.innerHTML = `
        <span class="badge-live"><i class="fas fa-circle" style="font-size:8px;"></i> AO VIVO</span>
        <div class="card-overlay">
          <div class="card-title">${ch.title}</div>
          <div class="card-sub">Transmissão Contínua</div>
        </div>
      `;
      card.onclick = () => openLiveChannelTV(ch);
      return card;
    }, true);
    return;
  }

  // MODO HOME PADRÃO TV
  heroEl.style.display = 'flex';
  catalogEl.classList.remove('full-height');

  // Barra de Filtro Rápido por Gênero
  const genres = ['Todos', ...new Set(catalog.flatMap(m => m.genres.filter(g => g !== 'Kids')))].sort((a, b) => a === 'Todos' ? -1 : a.localeCompare(b));
  const genreBar = document.createElement('div');
  genreBar.className = 'tv-genre-bar';
  genres.forEach(g => {
    const btn = document.createElement('button');
    btn.className = `genre-pill tv-focusable ${activeGenreFilter === g ? 'active' : ''}`;
    btn.textContent = g;
    btn.onclick = () => {
      activeGenreFilter = g;
      buildCatalogTV('home');
    };
    genreBar.appendChild(btn);
  });
  catalogEl.appendChild(genreBar);

  if (activeGenreFilter !== 'Todos') {
    const filtered = catalog.filter(m => m.genres.includes(activeGenreFilter));
    appendRowSection(catalogEl, `Gênero: ${activeGenreFilter} (${filtered.length})`, filtered, createMovieCardTV, true);
    return;
  }

  // 1. Continuar Assistindo
  const continuar = getContinuarAssistindo();
  if (continuar.length > 0) {
    appendRowSection(catalogEl, 'Continuar Assistindo', continuar, createMovieCardTV);
  }

  // 2. Canais ao Vivo
  appendRowSection(catalogEl, 'Canais ao Vivo', liveChannels, (ch) => {
    const card = document.createElement('div');
    card.className = 'card tv-focusable';
    card.tabIndex = 0;
    card.style.backgroundImage = `url('${ch.poster}')`;
    card.innerHTML = `
      <span class="badge-live"><i class="fas fa-circle" style="font-size:8px;"></i> AO VIVO</span>
      <div class="card-overlay">
        <div class="card-title">${ch.title}</div>
        <div class="card-sub">Transmissão Contínua</div>
      </div>
    `;
    card.onclick = () => openLiveChannelTV(ch);
    card.onfocus = () => card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    return card;
  });

  // 3. Fileiras Curadas
  appendRowSection(catalogEl, 'Sugestões para Você', catalog.slice(0, 10), createMovieCardTV);
  appendRowSection(catalogEl, 'Nossa Recomendação', catalog.slice(10, 20), createMovieCardTV);
  appendRowSection(catalogEl, 'Os 10 Melhores', catalog.slice(20, 30), createMovieCardTV);

  // 4. Filmes Clássicos YouTube (@classixapp)
  renderClassixYouTubeSection(catalogEl, false);

  // 5. Todas as Categorias / Gêneros
  const allGenres = [...new Set(catalog.flatMap(m => m.genres.filter(g => g !== 'Kids')))].sort();
  allGenres.forEach(genre => {
    const moviesInGenre = catalog.filter(m => m.genres.includes(genre));
    if (moviesInGenre.length >= 2) {
      appendRowSection(catalogEl, genre, moviesInGenre, createMovieCardTV);
    }
  });

  // 6. Loja Digital (Compra Avulsa)
  if (!isKidsMode) {
    storeCatalog.forEach(group => {
      appendRowSection(catalogEl, group.title, group.items, (item) => {
        const card = document.createElement('div');
        card.className = 'card tv-focusable';
        card.tabIndex = 0;
        card.style.backgroundImage = `url('${item.poster}')`;
        const priceStr = 'R$ ' + group.price.toFixed(2).replace('.', ',');
        card.innerHTML = `
          <span class="badge-price">${priceStr}</span>
          <div class="card-overlay">
            <div class="card-title">${limparStringTitulo(item.title)}</div>
            <div class="card-sub">${item.year} • Compra Digital</div>
          </div>
        `;
        card.onclick = () => openBuyModal(item, group.price);
        card.onfocus = () => card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        return card;
      });
    });
  }

  // 7. Catálogo Completo
  appendRowSection(catalogEl, isKidsMode ? 'Catálogo Infantil Completo' : 'Catálogo Completo', catalog, createMovieCardTV);
}

/* ==========================================================================
   7. INTEGRAÇÃO YOUTUBE API (@classixapp >= 10 MINUTOS)
   ========================================================================== */
function durationInSeconds(duration) {
  const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!match) return 0;
  return Number(match[1] || 0) * 3600 + Number(match[2] || 0) * 60 + Number(match[3] || 0);
}

async function fetchClassixBatch(rowEl, statusEl, loadMoreBtn) {
  if (ytLoading) return;
  ytLoading = true;
  if (loadMoreBtn) loadMoreBtn.disabled = true;

  try {
    if (!ytUploadsPlaylist) {
      const p = new URLSearchParams({ part: "contentDetails", forHandle: YT_CHANNEL_HANDLE, key: YT_API_KEY });
      const res = await fetch(`${YT_API_BASE}/channels?${p}`);
      const data = await res.json();
      if (!res.ok || !data.items?.length) throw new Error(data.error?.message || "Canal não encontrado");
      ytUploadsPlaylist = data.items[0].contentDetails.relatedPlaylists.uploads;
    }

    const p = new URLSearchParams({
      part: "snippet",
      playlistId: ytUploadsPlaylist,
      maxResults: "50",
      key: YT_API_KEY
    });
    if (ytNextPageToken) p.set("pageToken", ytNextPageToken);

    const res = await fetch(`${YT_API_BASE}/playlistItems?${p}`);
    const pData = await res.json();
    if (!res.ok) throw new Error(pData.error?.message || "Erro na playlist");

    ytNextPageToken = pData.nextPageToken || "";
    const ids = (pData.items || []).map(i => i.snippet?.resourceId?.videoId).filter(Boolean);

    if (ids.length) {
      const vParams = new URLSearchParams({
        part: "snippet,contentDetails,status",
        id: ids.join(","),
        key: YT_API_KEY
      });
      const vRes = await fetch(`${YT_API_BASE}/videos?${vParams}`);
      const vData = await vRes.json();

      (vData.items || []).forEach(v => {
        const secs = durationInSeconds(v.contentDetails?.duration || "");
        if (secs < 600 || v.status?.privacyStatus !== "public") return;
        if (ytLoadedIds.has(v.id)) return;
        ytLoadedIds.add(v.id);

        const thumbs = v.snippet.thumbnails || {};
        const thumb = thumbs.high?.url || thumbs.medium?.url || `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
        const cleanTitle = limparStringTitulo(v.snippet.title || "Filme Clássico");
        const vidObj = { id: v.id, title: cleanTitle, thumbnail: thumb };
        ytLoadedVideos.push(vidObj);
        rowEl.appendChild(createYouTubeCardTV(vidObj));
      });
    }

    if (statusEl) statusEl.textContent = ytLoadedVideos.length ? "" : "Nenhum vídeo encontrado.";
    if (loadMoreBtn) {
      loadMoreBtn.hidden = !ytNextPageToken;
      loadMoreBtn.disabled = false;
    }
  } catch (err) {
    if (statusEl) statusEl.textContent = "Erro YouTube: " + err.message;
  } finally {
    ytLoading = false;
  }
}

function createYouTubeCardTV(vid) {
  const card = document.createElement('div');
  card.className = 'card tv-focusable';
  card.tabIndex = 0;
  card.style.backgroundImage = `url('${vid.thumbnail}')`;

    <div class="card-overlay">
      <div class="card-title">${vid.title}</div>
      <div class="card-sub">Acervo Clássico Completo</div>
    </div>
  `;
  card.onclick = () => launchPlayerTV(`https://www.youtube.com/watch?v=${vid.id}`, null);
  card.onfocus = () => card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  return card;
}

function renderClassixYouTubeSection(container, isGrid) {
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header">
      <h2 class="section-title">Filmes Clássicos (YouTube Direto)</h2>
      <button class="btn-tv-secondary tv-focusable" id="ytLoadMoreBtn" style="padding:8px 16px; font-size:13px;" hidden>Carregar Mais</button>
    </div>
    <div id="ytStatusMsg" style="padding:0 48px 10px; color:var(--text-muted); font-size:14px;">Carregando filmes do YouTube...</div>
    <div class="row ${isGrid ? 'grid-mode' : ''}" id="ytClassixRow"></div>
  `;
  container.appendChild(sec);

  const rowEl = sec.querySelector('#ytClassixRow');
  const statusEl = sec.querySelector('#ytStatusMsg');
  const moreBtn = sec.querySelector('#ytLoadMoreBtn');

  if (ytLoadedVideos.length > 0) {
    statusEl.textContent = "";
    ytLoadedVideos.forEach(v => rowEl.appendChild(createYouTubeCardTV(v)));
    moreBtn.hidden = !ytNextPageToken;
  } else {
    fetchClassixBatch(rowEl, statusEl, moreBtn);
  }

  moreBtn.onclick = () => fetchClassixBatch(rowEl, statusEl, moreBtn);
}

  const q = searchInput.value.trim().toLowerCase();
  searchGrid.innerHTML = '';

    document.getElementById('searchCount').textContent = 'Digite para buscar em todo o catálogo';
    return;
  }

  const matches = getActiveCatalog().filter(m =>
    m.title.toLowerCase().includes(q) ||
    m.year.includes(q) ||
    String(m.id) === q ||
    m.genres.some(g => g.toLowerCase().includes(q))
  );

  const ytMatches = ytLoadedVideos.filter(v => v.title.toLowerCase().includes(q));
  document.getElementById('searchCount').textContent = `${matches.length + ytMatches.length} resultado(s) encontrado(s)`;

  matches.forEach(m => {
    const card = createMovieCardTV(m);
    card.style.width = '100%';
    card.style.minWidth = 'unset';
    card.onclick = () => {
      closeSearchTV();
      openDetailModal(m);

  ytMatches.forEach(v => {
    const card = createYouTubeCardTV(v);
    card.style.width = '100%';
    card.style.minWidth = 'unset';
    card.onclick = () => {
      closeSearchTV();
      launchPlayerTV(`https://www.youtube.com/watch?v=${v.id}`, null);

  });
});

  };
});

/* Teclas de Controle Remoto TV (Back / Escape / Enter / Setas) */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'Backspace') {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (document.getElementById('playerOverlay').style.display === 'block') {
      e.preventDefault();
      closePlayerTV();
      return;
    }
    if (searchOverlay.style.display === 'flex') {
      e.preventDefault();
      closeSearchTV();
      return;
    }
    if (document.getElementById('detailModal').style.display === 'flex') {
      e.preventDefault();
      document.getElementById('detailModal').style.display = 'none';
      return;
    }
    if (document.getElementById('buyModal').style.display === 'flex') {
      e.preventDefault();
      document.getElementById('buyModal').style.display = 'none';
      return;
    }
    if (document.getElementById('plusModal').style.display === 'flex') {
      e.preventDefault();
      document.getElementById('plusModal').style.display = 'none';
      return;
    }
  }
});

<script>
  (function() {
    'use strict';

    // Palavras-chave para identificar conteúdo infantil (ajuste conforme as categorias/tags do seu catálogo)
    const KIDS_KEYWORDS = ['kids', 'infantil', 'desenho', 'criança', 'animação', 'turma', 'bob esponja', 'peppa', 'patrulha'];

    function isKidsContent(element) {
        const text = (element.innerText || element.textContent || '').toLowerCase();
        const dataCategory = (element.getAttribute('data-category') || element.getAttribute('data-genre') || '').toLowerCase();
        const isKidsAttr = element.hasAttribute('data-kids') || element.classList.contains('is-kids');
        
        return isKidsAttr || KIDS_KEYWORDS.some(kw => text.includes(kw) || dataCategory.includes(kw));
    }

    function isKidsModeActive() {
        // Verifica flags comuns no localStorage, URL ou classes no body/html
        const userFlag = localStorage.getItem('glplus_user') || '';
        const kidsFlag = localStorage.getItem('glplus_kids_mode') || localStorage.getItem('kids_mode');
        return kidsFlag === 'true' || 
               userFlag.toLowerCase().includes('kids') || 
               document.body.classList.contains('kids-mode') ||
               window.location.hash.includes('kids') ||
               window.location.search.includes('kids=true');
    }

    function applyFixes() {
        const kidsMode = isKidsModeActive();

        // 1. Renomear aba "Clássicos YT" para "Clássicos" e remover menções/logos do YouTube
        document.querySelectorAll('a, button, li, span, h1, h2, h3, div').forEach(el => {
            // Evita alterar containers grandes que tenham muitos filhos
            if (el.children.length === 0 && el.textContent) {
                if (el.textContent.trim() === 'Clássicos YT') {
                    el.textContent = 'Clássicos';
                }
                if (el.textContent.includes('YouTube direto')) {
                    el.textContent = el.textContent.replace(/YouTube direto/gi, '').trim();
                    if (el.textContent === '') el.style.display = 'none';
                }
            }
        });

        // Remover ícones/logos do YouTube nos cards de clássicos
        document.querySelectorAll('img[src*="youtube"], svg[class*="youtube"], .yt-logo, .youtube-badge, [title*="YouTube"]').forEach(logo => {
            logo.style.display = 'none';
        });

        // 2. Regras estritas para o Modo Kids
        // Seleciona abas/menus de "Clássicos" e "Ao Vivo"
        const navItems = document.querySelectorAll('nav a, nav button, .menu-item, .tab-item, [role="tab"]');
        navItems.forEach(tab => {
            const label = (tab.textContent || '').toLowerCase().trim();
            if (label === 'clássicos' || label === 'clássicos yt' || label.includes('vivo') || label.includes('live')) {
                tab.style.display = kidsMode ? 'none' : '';
            }
        });

        // Ocultar seções inteiras de Clássicos, Ao Vivo e Continue Assistindo (se não tiverem itens Kids)
        const sections = document.querySelectorAll('section, .row, .carousel-container, .category-section');
        sections.forEach(section => {
            const titleEl = section.querySelector('h1, h2, h3, .section-title, .row-title');
            const titleText = titleEl ? titleEl.textContent.toLowerCase() : '';

            if (kidsMode) {
                // Esconde diretamente seções de Clássicos ou Ao Vivo
                if (titleText.includes('clássico') || titleText.includes('vivo') || titleText.includes('live')) {
                    section.style.display = 'none';
                    return;
                }

                // Filtra cards individuais dentro de "Continue Assistindo" e outras fileiras
                const cards = section.querySelectorAll('.card, .movie-card, .item, [data-id]');
                let visibleCards = 0;

                cards.forEach(card => {
                    if (isKidsContent(card)) {
                        card.style.display = '';
                        visibleCards++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                // Se for "Continue Assistindo" (ou qualquer outra seção) e não sobrou nenhum card Kids, esconde a fileira toda
                if (cards.length > 0 && visibleCards === 0) {
                    section.style.display = 'none';
                } else if (cards.length > 0) {
                    section.style.display = '';
                }
            } else {
                // Restaura a visibilidade fora do Modo Kids
                section.style.display = '';
                section.querySelectorAll('.card, .movie-card, .item, [data-id]').forEach(card => {
                    card.style.display = '';
                });
            }
        });
    }

    // Executa imediatamente ao carregar
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyFixes);
    } else {
        applyFixes();
    }

    // Observa mudanças no DOM (troca de abas, carregamento dinâmico de cards, ativação do modo kids)
    const observer = new MutationObserver(() => {
        // Desconecta temporariamente para evitar loop infinito ao alterar estilos
        observer.disconnect();
        applyFixes();
        observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    });

    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
})();
</script>
